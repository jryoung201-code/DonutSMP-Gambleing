name: Build and Release DonutSMP Game Hub Mod

on:
  push:
    paths:
      - 'mod/**'
      - 'backend/**'
      - 'bot/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check backend and bot JavaScript syntax
        working-directory: .
        run: |
          node --check backend/src/index.js
          node --check bot/src/desktop-agent.js

      - name: Install desktop bot dependencies
        working-directory: .
        run: npm ci --prefix bot

      - name: Build Windows desktop bot
        working-directory: .
        run: npm run build:desktop:win --prefix bot

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: donutsmp-gamehub-mod
          path: |
            mod/build/libs/*.jar
            bot/dist/DonutSMPDesktopBot.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.6
          name: DonutSMP Game Hub v0.1.6
          generate_release_notes: true
          files: |
            mod/build/libs/donutsmp-game-hub-0.1.6.jar
            bot/dist/DonutSMPDesktopBot.exe
