services:
  - type: web
    name: donutsmp-game-hub-api
    runtime: node
    plan: free
    repo: https://github.com/jryoung201-code/DonutSMP-Gambleing-AI
    branch: main
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    autoDeploy: yes
    healthCheckPath: /health
    envVars:
      - key: PAYMENT_TARGET
        value: VoduDoll_YT
      - key: SHOW_ODDS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: donutsmp-game-hub-db
          property: connectionString

databases:
  - name: donutsmp-game-hub-db
    plan: free
    region: ohio
    databaseName: donutsmp_game_hub_db
    user: donutsmp_game_hub_db_user
