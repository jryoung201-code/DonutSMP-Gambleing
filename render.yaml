services:
  - type: web
    name: donutsmp-game-hub-api
    runtime: node
    plan: free
    repo: https://github.com/jryoung201-code/DonutSMP-Gambleing-AI
    branch: main
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    autoDeploy: yes
    healthCheckPath: /health
    envVars:
      - key: PAYMENT_TARGET
        value: VoduDoll_YT
      - key: SHOW_ODDS
        value: "false"
